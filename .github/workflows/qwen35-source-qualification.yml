name: Qwen3.5 source qualification

on:
  pull_request:
  push:
    branches:
      - state/qwen35-hf-training-continuation-20260923-v1
    paths:
      - "successor/v5/**"
      - "tests/test_qwen35_substrate.py"
      - ".github/workflows/qwen35-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install source-test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile Qwen source path
        run: python -m py_compile successor/v5/train_v5.py successor/v5/train_qwen35_v5.py successor/v5/qwen35_substrate.py tests/test_qwen35_substrate.py
      - name: Run Qwen source qualification
        run: python -m pytest -q tests/test_qwen35_substrate.py
      - name: Whitespace check
        run: git diff --check HEAD^..HEAD
