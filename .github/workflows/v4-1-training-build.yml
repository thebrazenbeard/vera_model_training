name: V4.1 Training Corpus Build

on:
  push:
    branches:
      - "work/v4.1-diverse-core-20260930"
    paths:
      - "successor/build_v4_1_hf_rehearsal.py"
      - "successor/build_v4_1_training_corpus.py"
      - "successor/corpus/v4_1/custom/**"
      - ".github/workflows/v4-1-training-build.yml"
  workflow_dispatch:

concurrency:
  group: v4.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install rehearsal dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "datasets==4.1.1" \
            "transformers==5.14.1" \
            "jinja2==3.1.6"

      - name: Verify V4.1 training arithmetic
        run: |
          PYTHONPATH=. python - <<'PY'
          from successor import build_v4_1_hf_rehearsal as rehearsal
          from successor import build_v4_1_training_corpus as training
          assert rehearsal.EXPECTED_ROWS == 42500
          assert sum(rehearsal.TARGETS.values()) == 42500
          assert training.EXPECTED_TRAIN_ROWS == 50000
          assert training.EXPECTED_VALIDATION_ROWS == 2500
          assert training.EXPECTED_TRAIN_ROWS + training.EXPECTED_VALIDATION_ROWS == 52500
          print("V4.1 training arithmetic PASS")
          PY

      - name: Run semantic quality gate before training split
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m venv /tmp/v4-1-semantic-env
          /tmp/v4-1-semantic-env/bin/pip install --disable-pip-version-check "sentence-transformers==3.4.1"
          PYTHONPATH=. /tmp/v4-1-semantic-env/bin/python successor/semantic_diversity_gate.py             --v4 successor/corpus/v4/custom             --v41 successor/corpus/v4_1/custom             --output /tmp/v4-1-semantic-receipt.json

      - name: Build V4.1 train/validation split
        run: |
          rm -rf /tmp/vera-v4.1
          PYTHONPATH=. python successor/build_v4_1_training_corpus.py             --train /tmp/vera-v4.1/train.jsonl             --validation /tmp/vera-v4.1/validation.jsonl             --manifest successor/corpus/v4_1/training_manifest.json
      - name: Verify split contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("successor/corpus/v4_1/training_manifest.json").read_text())
          assert manifest["source_rows"] == 52500
          assert manifest["train_rows"] == 50000
          assert manifest["validation_rows"] == 2500
          assert manifest["train_validation_overlap"] == 0
          assert manifest["custom_source"]["rows"] == 10000
          assert manifest["rehearsal_source"]["rows"] == 42500
          assert manifest["training_authorization"] == "NOT_GRANTED"
          print("V4.1 training split contract PASS")
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add successor/corpus/v4_1/training_manifest.json
          if git diff --cached --quiet; then
            echo "No training manifest changes."
            exit 0
          fi
          git commit -m "Record reproducible V4.1 50k training split"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to persist training manifest after three attempts."
          exit 1
