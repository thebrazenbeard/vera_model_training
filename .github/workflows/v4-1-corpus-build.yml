name: V4.1 Diverse Corpus Build

on:
  push:
    branches:
      - "work/v4.1-diverse-core-20260930"
    paths:
      - "successor/build_v4_1_diverse_corpus.py"
      - "successor/corpus/v4_1/custom/**"
      - "successor/compare_v4_v4_1_corpus.py"
      - "tests/test_v4_1_diverse_corpus.py"
      - "successor/build_v4_1_review_set.py"
      - "successor/corpus/v4_1/behavioral_review_set.jsonl"
      - ".github/workflows/v4-1-corpus-build.yml"
  workflow_dispatch:

concurrency:
  group: v4.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate V4.1 corpus
        run: |
          rm -rf successor/corpus/v4_1/custom
          PYTHONPATH=. python successor/build_v4_1_diverse_corpus.py --output-dir successor/corpus/v4_1/custom
      - name: Build behavioral review sample
        run: |
          PYTHONPATH=. python successor/build_v4_1_review_set.py             --root successor/corpus/v4_1/custom             --output successor/corpus/v4_1/behavioral_review_set.jsonl

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Verify generated corpus
        run: |
          python -m py_compile successor/build_v4_1_diverse_corpus.py tests/test_v4_1_diverse_corpus.py
          python -m pytest -q tests/test_v4_1_diverse_corpus.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("successor/corpus/v4_1/custom")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["rows"] == 10000
          assert manifest["pair_uniqueness"] == 10000
          assert manifest["response_uniqueness"] == 10000
          assert len(manifest["families"]) == 10
          for family, meta in manifest["families"].items():
              assert meta["rows"] == 1000, family
              assert meta["unique_prompts"] == 1000, family
              assert meta["unique_responses"] == 1000, family
              assert meta["domains"] == 20, family
              assert meta["cognitive_levels"] == 5, family
          print("V4.1 corpus contract PASS")
          PY
      - name: Compare V4 and V4.1 diversity
        run: |
          PYTHONPATH=. python successor/compare_v4_v4_1_corpus.py             --v4 successor/corpus/v4/custom             --v41 successor/corpus/v4_1/custom             --output successor/corpus/v4_1/custom/diversity_comparison.json

      - name: Commit generated corpus
        run: |
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            rm -rf successor/corpus/v4_1/custom
            PYTHONPATH=. python successor/build_v4_1_diverse_corpus.py --output-dir successor/corpus/v4_1/custom
            PYTHONPATH=. python successor/build_v4_1_review_set.py               --root successor/corpus/v4_1/custom               --output successor/corpus/v4_1/behavioral_review_set.jsonl
            python -m pytest -q tests/test_v4_1_diverse_corpus.py
            PYTHONPATH=. python successor/compare_v4_v4_1_corpus.py               --v4 successor/corpus/v4/custom               --v41 successor/corpus/v4_1/custom               --output successor/corpus/v4_1/custom/diversity_comparison.json
            git add successor/corpus/v4_1/custom successor/corpus/v4_1/behavioral_review_set.jsonl
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --cached --quiet; then
              echo "No generated corpus changes."
              exit 0
            fi
            git commit -m "Generate V4.1 diverse 10k core corpus"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep 2
          done
          echo "Unable to persist generated corpus after three source-refresh attempts."
          exit 1

