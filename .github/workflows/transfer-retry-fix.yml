name: Transfer Retry TDD Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: >-
      ${{
        github.event.repository.private == false &&
        github.actor == github.repository_owner &&
        startsWith(github.event.issue.title, '[FIX-TRANSFER-RETRY]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Write regression tests
        shell: bash
        run: |
          cat > tests/test_transfer_retry.py <<'PY'
          import pytest
          import bootcamp


          def _round(task):
              return {
                  "task": task,
                  "capability_ids": ["rls"],
                  "hidden_rubric": ["check"],
                  "adversarial": True,
                  "critical": True,
              }


          def test_build_transfer_tasks_retries_valid_but_incomplete_generation(monkeypatch):
              caps = [bootcamp.Capability("rls", "RLS", "Row level security", True)]
              curriculum = [_round("prior task")]
              responses = iter([
                  {"rounds": [_round("only one")]},
                  {"rounds": [_round("transfer one"), _round("transfer two")]},
              ])
              calls = []

              def fake_json_llm(*args, **kwargs):
                  calls.append((args, kwargs))
                  return next(responses)

              monkeypatch.setattr(bootcamp, "json_llm", fake_json_llm)
              out = bootcamp.build_transfer_tasks(
                  {"function": "Supabase Platform Specialist"}, caps, curriculum
              )
              assert len(out) == 2
              assert len(calls) == 2


          def test_build_transfer_tasks_fails_closed_after_two_invalid_generations(monkeypatch):
              caps = [bootcamp.Capability("rls", "RLS", "Row level security", True)]
              curriculum = [_round("prior task")]
              calls = []

              def fake_json_llm(*args, **kwargs):
                  calls.append((args, kwargs))
                  return {"rounds": [_round("still only one")]}

              monkeypatch.setattr(bootcamp, "json_llm", fake_json_llm)
              with pytest.raises(ValueError, match="at least 2 rounds"):
                  bootcamp.build_transfer_tasks(
                      {"function": "Supabase Platform Specialist"}, caps, curriculum
                  )
              assert len(calls) == 2
          PY

      - name: RED - prove current code reproduces the bug
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_transfer_retry.py > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -q "curriculum requires at least 2 rounds" red.log
          echo "RED verified: current build_transfer_tasks does not retry semantic validation failures."

      - name: Apply minimal semantic retry fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bootcamp.py")
          text = path.read_text(encoding="utf-8")
          pattern = r"def build_transfer_tasks\(spec: dict\[str, Any\], caps: list\[Capability\], curriculum: list\[dict\[str, Any\]\]\) -> list\[dict\[str, Any\]\]:\n.*?(?=\n\ndef run_transfer\()"
          replacement = '''def build_transfer_tasks(spec: dict[str, Any], caps: list[Capability], curriculum: list[dict[str, Any]]) -> list[dict[str, Any]]:
              prior = [t["task"] for t in curriculum]
              base_prompt = f"FUNCTION: {spec['function']}\\nCAPABILITIES:\\n{capability_snapshot(caps)}\\nPRIOR TRAINING TASKS (do not reuse):\\n{json.dumps(prior)}"
              last_error: ValueError | None = None
              previous_obj: dict[str, Any] | None = None
              for attempt in range(2):
                  prompt = base_prompt
                  if last_error is not None:
                      prompt += (
                          f"\\nPREVIOUS ATTEMPT INVALID: {last_error}"
                          "\\nReturn exactly two complete round objects under key rounds. "
                          "Every round must include task, capability_ids, hidden_rubric, adversarial, and critical."
                      )
                      if previous_obj is not None:
                          prompt += f"\\nPREVIOUS OBJECT:\\n{clamp(json.dumps(previous_obj), 1500)}"
                  obj = json_llm(
                      TRANSFER_SYSTEM,
                      prompt,
                      max_tokens=800,
                      temperature=0.45 if attempt == 0 else 0.2,
                  )
                  try:
                      return validate_curriculum(obj, 2, caps)
                  except ValueError as exc:
                      last_error = exc
                      previous_obj = obj
              assert last_error is not None
              raise last_error
          '''
          new_text, count = re.subn(pattern, replacement.rstrip(), text, flags=re.S)
          if count != 1:
              raise SystemExit(f"expected one build_transfer_tasks replacement, got {count}")
          path.write_text(new_text, encoding="utf-8")
          PY

      - name: GREEN - verify regression and full suite
        shell: bash
        run: |
          python -m py_compile bootcamp.py fast_bootcamp.py
          python -m pytest -q tests/test_transfer_retry.py
          python -m pytest -q

      - name: Commit only if main has not moved
        shell: bash
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${START_SHA}" || {
            echo "main moved during validation; refusing to overwrite newer work" >&2
            exit 1
          }
          git config user.name "identity-bootcamp-tdd"
          git config user.email "identity-bootcamp-tdd@users.noreply.github.com"
          git add bootcamp.py tests/test_transfer_retry.py
          git commit -m "Retry incomplete transfer task generations"
          git push origin HEAD:main

      - name: Post result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "${ISSUE_NUMBER}" --body "Transfer retry bug fixed test-first: RED reproduced the semantic under-generation failure, GREEN passed the new regression tests and full suite, and the fix was committed to main."

      - name: Post failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: gh issue comment "${ISSUE_NUMBER}" --body "Transfer retry fix workflow failed closed. ${RUN_URL}"
