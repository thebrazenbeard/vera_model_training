name: Vera Fine Art Visual Study

on:
  push:
    branches:
      - vera-visual-study-20260812
    paths:
      - '.github/workflows/vera-visual-study.yml'
      - 'experiments/vera_visual_study/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU diffusion stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers>=0.35,<0.38' 'transformers>=4.56,<5' 'accelerate>=1.10,<2' safetensors huggingface_hub

      - name: Generate candidates
        run: python experiments/vera_visual_study/generate.py

      - name: Upload generated candidates
        uses: actions/upload-artifact@v4
        with:
          name: vera-fine-art-candidates
          path: vera_visual_output/*.png
          if-no-files-found: error
          retention-days: 1
