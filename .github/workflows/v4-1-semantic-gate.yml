name: V4.1 Semantic Diversity Gate

on:
  push:
    branches:
      - "work/v4.1-diverse-core-20260930"
    paths:
      - "successor/build_v4_1_diverse_corpus.py"
      - "successor/corpus/v4/custom/**"
      - "successor/corpus/v4_1/custom/**"
      - "successor/semantic_diversity_gate.py"
      - ".github/workflows/v4-1-semantic-gate.yml"
  workflow_dispatch:

concurrency:
  group: v4.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  semantic:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install semantic evaluator
        run: python -m pip install --disable-pip-version-check "sentence-transformers==3.4.1" "pytest==8.4.2"
      - name: Build candidate corpus from current generator
        run: |
          rm -rf /tmp/vera-v4.1-semantic
          PYTHONPATH=. python successor/build_v4_1_diverse_corpus.py --output-dir /tmp/vera-v4.1-semantic
          python -m pytest -q tests/test_v4_1_diverse_corpus.py

      - name: Run semantic diversity comparison
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          PYTHONPATH=. python successor/semantic_diversity_gate.py             --v4 successor/corpus/v4/custom             --v41 /tmp/vera-v4.1-semantic             --output successor/corpus/v4_1/semantic_diversity_comparison.json
      - name: Persist semantic receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add successor/corpus/v4_1/semantic_diversity_comparison.json
          if git diff --cached --quiet; then
            echo "No semantic receipt changes."
            exit 0
          fi
          git commit -m "Record V4.1 semantic diversity comparison"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to persist semantic receipt after three attempts."
          exit 1
