name: V3 GREEN Patch

on:
  push:
    branches: [fix/bootcamp-quality-v3]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.event.head_commit.message == 'Add one-shot V3 GREEN patch workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('bootcamp.py')
          s = p.read_text()
          old = '''@dataclass
          class Capability:
              id: str
              name: str
              description: str
              critical: bool
              score: int = 0
              observations: int = 0
          '''
          new = '''@dataclass
          class Capability:
              id: str
              name: str
              description: str
              critical: bool
              score: int = 0
              observations: int = 0
              evidence_url: str = ""
              evidence_quote: str = ""
          '''
          if old not in s:
              raise SystemExit('Capability block not found')
          s = s.replace(old, new, 1)

          old = '''    obj["score"] = max(0, min(4, int(obj.get("score", 0))))
              obj["passed"] = bool(obj.get("passed", obj["score"] >= 3))
              obj["critical_failure"] = bool(obj.get("critical_failure", False))
              obj["capability_updates"] = obj.get("capability_updates") if isinstance(obj.get("capability_updates"), dict) else {}
              obj["corrections"] = obj.get("corrections") if isinstance(obj.get("corrections"), list) else []
              return obj
          '''
          new = '''    obj["score"] = max(0, min(4, int(obj.get("score", 0))))
              obj["critical_failure"] = bool(obj.get("critical_failure", False))
              obj["capability_updates"] = obj.get("capability_updates") if isinstance(obj.get("capability_updates"), dict) else {}
              obj["corrections"] = obj.get("corrections") if isinstance(obj.get("corrections"), list) else []
              if obj["corrections"] and obj["score"] > 3:
                  obj["score"] = 3
              for cid, raw_score in list(obj["capability_updates"].items()):
                  try:
                      obj["capability_updates"][cid] = min(obj["score"], max(0, min(4, int(raw_score))))
                  except Exception:
                      obj["capability_updates"].pop(cid, None)
              obj["passed"] = bool(obj.get("passed", obj["score"] >= 3)) and obj["score"] >= 3
              return obj
          '''
          if old not in s:
              raise SystemExit('examine postprocess block not found')
          s = s.replace(old, new, 1)

          old = '''        lesson = str(exam.get("durable_lesson", "")).strip()
              if exam["passed"] and lesson:
                  lessons.append(clamp(lesson, 500))
              for correction in exam["corrections"]:
                  correction = str(correction).strip()
                  if correction:
                      lessons.append("CORRECTION: " + clamp(correction, 450))
              regression = str(exam.get("regression_case", "")).strip()
          '''
          new = '''        # Examiner-authored lessons/corrections are retained in the audit only.
              # They are hypotheses from the same local model, not verified source authority,
              # so automatically feeding them forward can compound a false correction.
              regression = str(exam.get("regression_case", "")).strip()
          '''
          if old not in s:
              raise SystemExit('lesson promotion block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('.github/workflows/identity-bootcamp.yml')
          s = p.read_text()
          replacements = {
              'MODEL_NAME: "Qwen3-1.7B-Q4_K_M-local"': 'MODEL_NAME: "Qwen3-4B-Q4_K_M-local"',
              'MODEL_FILE: "Qwen3-1.7B-Q4_K_M.gguf"': 'MODEL_FILE: "Qwen3-4B-Q4_K_M.gguf"',
              'MODEL_SHA256: "d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5"': 'MODEL_SHA256: "7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5"',
              'MODEL_URL: "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"': 'MODEL_URL: "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true"',
              'key: qwen3-17b-q4km-${{ env.MODEL_SHA256 }}': 'key: qwen3-4b-q4km-${{ env.MODEL_SHA256 }}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'model workflow token not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('run_bootcamp.py')
          s = p.read_text()
          if 'from pathlib import Path' not in s:
              s = s.replace('import json\n', 'import json\nfrom pathlib import Path\n', 1)
          old = '    bootcamp.write_outputs(spec, capsule, qual, regressions, audit, transfers, evidence, curriculum)\n'
          new = old + '    Path("out/SOURCE_EXCERPTS.md").write_text(fast_bootcamp.get_source_pack().strip() + "\\n", encoding="utf-8")\n'
          if old not in s:
              raise SystemExit('run_bootcamp output call not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: GREEN verification
        run: |
          python -m py_compile bootcamp.py fast_bootcamp.py quality_gate.py run_bootcamp.py
          python -m pytest -q
      - name: Commit verified patch
        run: |
          git config user.name "identity-bootcamp-tdd"
          git config user.email "identity-bootcamp-tdd@users.noreply.github.com"
          git add bootcamp.py run_bootcamp.py .github/workflows/identity-bootcamp.yml
          git commit -m "Implement V3 source-grounded bootcamp hardening"
          git push origin HEAD:fix/bootcamp-quality-v3
